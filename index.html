<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chefe de Casa | Receitas Práticas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Topo do Site -->
    <header>
        <div class="header-container">
            <h1>🍳 Chefe de Casa</h1>
            <p>Suas receitas fáceis e deliciosas em um só lugar</p>
            
            <!-- Barra de Pesquisa -->
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Digite um ingrediente ou prato... (Ex: Brigadeiro, Panqueca)">
                <button id="search-button">Buscar</button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="main-container">
        <h2 class="section-title">✨ Receitas em Destaque</h2>
        
        <!-- Grade de Receitas (O JavaScript vai preencher aqui) -->
        <div class="recipes-grid" id="recipes-grid"></div>
    </main>

    <!-- Janela Flutuante (Modal) para mostrar o passo a passo completo -->
    <div class="modal" id="recipe-modal">
        <div class="modal-content">
            <span class="close-button" id="close-modal">&times;</span>
            <div id="modal-body">
                <!-- Preenchido dinamicamente pelo JavaScript -->
            </div>
        </div>
    </div>

    <!-- Rodapé -->
    <footer>
        <p>© 2026 Chefe de Casa - Criado com carinho.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
